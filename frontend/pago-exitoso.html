<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackMonk - Pago exitoso</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,sans-serif;background:#f0fdf4;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:16px;padding:3rem;text-align:center;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
    .icon{font-size:4rem;margin-bottom:1rem}
    h1{font-size:1.5rem;color:#111;margin-bottom:0.5rem}
    p{color:#666;margin-bottom:1.5rem}
    a{display:inline-block;padding:0.8rem 2rem;background:#22c55e;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}
    a:hover{background:#16a34a}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>¡Pago exitoso!</h1>
    <p>Tu plan ha sido activado. Ya puedes usar todas las funcionalidades de TrackMonk.</p>
    <a href="/admin.html">Ir al panel admin</a>
  </div>
</body>
</html>
